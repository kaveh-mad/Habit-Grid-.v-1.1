:root{--bg:#0d1417;--pn:#152127;--p2:#1f2e35;--ink:#e6efec;--mut:#8ea39f;--ln:#29393f;--acc:#ffb454;--on:#1a1204;--bad:#ff7b72;--ok:#5fd6a0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#eef3f0;--pn:#fff;--p2:#e3ebe7;--ink:#12211e;--mut:#5a6d68;--ln:#d2dcd7;--acc:#c75a0a;--on:#fff;--bad:#c62f27;--ok:#12805a;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--ff,"Vazirmatn"),system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding:20px 16px 60px;max-width:960px;margin:0 auto}
h1,h2,h3{font-family:var(--fh,"Bricolage Grotesque"),"Vazirmatn",system-ui,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln);background:var(--pn);border-radius:10px;padding:8px 14px;font-weight:600}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--on);border-color:var(--acc)}
button.dng{color:var(--bad)}

function warnUI(){const el=$("#warn");if(!el)return;const now=new Date(),t=back(0);
el.innerHTML=S.warn&&now.getHours()>=S.warnHour?S.habits.filter(h=>!h.done.includes(t)&&streak(h)>0).map(h=>`<div class="w">⚠️ <span>${esc(T("w_risk",h.name,streak(h)))}</span></div>`).join(""):""}

function toast(m,bad){const e=document.createElement("div");e.className="ts"+(bad?" bad":"");e.textContent=m;$("#toasts").append(e);setTimeout(()=>e.remove(),4500)}
function beep(){if(!S.sound)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);o.start();o.stop(c.currentTime+.5)}catch(e){}}
function notify(title,body){toast(title);beep();if(S.notif&&window.Notification&&Notification.permission==="granted")try{new Notification(title,{body})}catch(e){}}

function toggle(id,d){const h=S.habits.find(x=>x.id===id);if(!h)return;const i=h.done.indexOf(d);if(i<0)h.done.push(d);else h.done.splice(i,1);save();render();
if(i<0&&d===back(0)){const s=streak(h);if([3,7,14,30,60,100,200,365].includes(s))notify(T("mile",s,h.name),"")}}

function modal(html){$("#md").innerHTML=html;$("#ov").classList.add("on")}
const closeM=()=>{$("#ov").classList.remove("on");if(typeof REC!=="undefined"&&REC&&REC.state==="recording")REC.stop()};

function openForm(h){D=h?{...h,done:[...h.done]}:{name:"",icon:"📌",image:null,color:COLORS[4],type:"build",goal:5,remind:"",done:[]};form();setTimeout(()=>$("#fn")&&$("#fn").focus(),30)}
function saveForm(){readForm();const name=D.name.trim();if(!name)return toast(T("need"),1);
if(S.habits.some(h=>h.id!==D.id&&h.name.toLowerCase()===name.toLowerCase()))return toast(T("dup"),1);

if(S.ct!=="brick"&&NH){const pts=cnt.map((a,i)=>[i*10+5,+(base-a.length/NH*hh).toFixed(2)]),P=pts.map(p=>p.join(",")).join(" ");s+=`<polygon points="5,${base} ${P} ${W-5},${base}" fill="var(--acc)" opacity=".15"/><polyline points="${P}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="miter" stroke-miterlimit="10" vector-effect="non-scaling-stroke"/>`;if(n<=31)pts.forEach((p,i)=>s+=`<path d="M${p[0]} ${p[1]}h.01" stroke="${i===n-1?"var(--ink)":"var(--acc)"}" stroke-width="${i===n-1?10:7}" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`)}
s+=`<rect x="${(n-1)*10}" y="66" width="10" height="3" fill="var(--ink)"/>`;
days.forEach((d,i)=>s+=`<rect x="${i*10}" y="0" width="10" height="72" fill="transparent"><title>${fmt(d)}: ${N(cnt[i].length)}/${N(NH)}</title></rect>`);
const sg=(k,vals)=>`<div class="seg">${vals.map(([v,l])=>`<button class="${S[k]===v?"on":""}" data-a="cset" data-k="${k}" data-v="${v}">${l}</button>`).join("")}</div>`;
return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">${sg("ct",[["brick","🧱 "+T("ch_brick")],["line","📈 "+T("ch_line")],["both","🧱+📈"]])}${sg("cr",[[7,N(7)],[30,N(30)],[90,N(90)]])}</div>`+s+"</svg>"+(NH&&cnt.every(a=>!a.length)?`<p class="sub" style="margin-top:8px">${T("ch_empty")}</p>`:"")}
Object.assign(ACT,{ap:(e)=>{const p=e.parentNode;p.dataset.pm=e.dataset.v;[...p.children].forEach(b=>b.classList.toggle("on",b===e))},

const TUT={
en:["Tutorial","About me","My Habit helps you build habits, take medicines on time, keep notes and voice memos, and stay on track with alarms and charts. Your data stays only on your device.",
"Top: the ⚙️ button opens Options. On the other side you see the live clock and today’s date.",
"Top bar: “New habit”, Medicines, My habits, Notebook, Alarms & timers and Stats. Each button opens its section and scrolls to it.",
"Group bar: All, Toddlers, School kids, Seniors, Adults and “New group”. ✏️ Edit group changes the name, icon and color. The 🔒 Parent button unlocks the kids’ groups.",
"New habit: name; kind (Build it or Let it go); icon (pick an emoji, type your own emoji, or upload an image); color (ready-made or custom); weekly goal; and a daily reminder with an AM/PM picker.",
"Habit card: the round ✓ button marks today. Every square is a day; tap it to mark or unmark. The small ring compares this week with your goal. Edit and Delete sit under the squares; 🔔 shows the reminder time.",
"Quick add: ready-made habits for the group you are in, added with one tap.",
"Kids’ groups: a “Today’s board” with big tiles and stars. Set a 4-digit parent PIN in Options and adding, editing, deleting and past days stay locked; only marking today works.",
"Medicines: “New medicine” asks for name, dose, icon, up to four times a day (AM/PM), amount left and a low-stock limit. Tap a dose to tick it; the amount goes down by one. The last 7 days show how much you took.",
"Notebook: “New note” has a date, title, text, 📌 pin, ☑️ checklist (start a line with [ ]), 🕒 date & time, tags, color and 🎙️ voice recording. In the list: search, newest or oldest, tag buttons, Edit, Copy and Delete.",
"Alarms: “New alarm” has a name, a time (AM/PM) and the days: every day, chosen weekdays, or one special date from the calendar. The switch turns it on or off.",
"Timers: “New timer” — type the length or tap 1, 5, 10, 15, 30 or 60, then Start. The countdown is live.",
"Ring window: when an alarm, timer or medicine time comes, a big window appears and a bell rings until you act: Stop, Snooze 5 min, or ✓ Taken for medicines.",
"Stats & chart: today’s ring, best run, average, and a chart as 🧱 bricks, 📈 jagged line or both, over 7, 30 or 90 days.",
"Warnings (red, at the top): late medicines, low stock and, in the evening, habits that would break a streak.",
"Options: Language (30), Theme (Gray, Dark, Light, Auto), Grid length (30–180 days), Time format (12h AM/PM or 24h), Sound, Device notifications, Evening warnings and hour, Keep screen on, Parent PIN, Colors & text, Backup & restore, Erase everything.",
"Colors & text: every color, body and heading fonts (14), text, heading and note sizes, and corners from sharp to round. Reset brings back the defaults.",
"Remember: your data stays only on this device. For medicine alarms keep this page open and the screen on (Options → Keep screen on helps)."],
fa:["راهنمای همه‌چیز","دربارهٔ من","مای هبیت به شما کمک می‌کند خوهای روزانه بسازید، داروها را سر هنگام بخورید، یادداشت و آوا نگه دارید و با زنگ و نمودار همیشه در راه بمانید. داده‌های شما تنها روی دستگاه خودتان می‌ماند.",
"بالای برگه: دکمهٔ ⚙️ «گزینه‌ها» را باز می‌کند و در سوی دیگر، هنگام‌نمای زنده با روز امروز است.",
"نوار بالایی: «خوی نو»، داروها، خوها، دفترچه، زنگ و تایمر، و آمار. هر دکمه بخش خودش را باز می‌کند و تا آنجا می‌لغزد.",
"نوار گروه‌ها: «همه»، خردسالان، آموزش و کارهای کودکان، سالمندان، بزرگسالان و «گروه نو». ✏️ «ویرایش گروه» نام، نماد و رنگ را دگرگون می‌کند. دکمهٔ 🔒 «پدر و مادر» بندِ گروه‌های کودکان را باز می‌کند.",
"خوی نو: نام؛ گونه («ساختن» یا «رها کردن»)؛ نماد (برگزیدن یک ایموجی، نوشتن ایموجی خودتان، یا بارگذاری نگاره)؛ رنگ (آماده یا دلخواه)؛ آماج هفتگی؛ و یادآور روزانه با برگزیننده‌ای که AM و PM دارد.",
"کارت هر خو: دکمهٔ گرد ✓ امروز را نشان می‌زند. هر چهارخانه یک روز است؛ با زدن، نشان می‌خورد یا برمی‌گردد. نمودار گرد کوچک، این هفته را با آماج می‌سنجد. «ویرایش» و «پاک کردن» زیر چهارخانه‌هاست و 🔔 هنگام یادآور را نشان می‌دهد.",
"افزودن زود: خوهای آمادهٔ همان گروه را با یک بار زدن می‌افزاید.",
"گروه‌های کودکان: «تختهٔ امروز» با تکه‌های بزرگ و ستاره. در «گزینه‌ها» گذرواژهٔ چهار شماره‌ای بگذارید تا افزودن، ویرایش، پاک کردن و روزهای گذشته بسته بماند؛ تنها نشان زدنِ امروز آزاد است.",
"داروها: «داروی نو» نام، اندازه، نماد، تا چهار بار در روز (با AM و PM)، شمار مانده و مرز هشدار را می‌خواهد. هر بار خوردن را بزنید تا ✓ شود و شمار مانده یکی کم شود. ۷ روز گذشته، درصد خورده‌شدن را نشان می‌دهد.",
"دفترچه: «یادداشت نو» روز، سرنویس، نوشته، 📌 سنجاق، ☑️ سیاهه‌ی کار («[ ]» را در آغاز نوشته بگذارید)، 🕒 روز و هنگام، برچسب‌ها، رنگ و 🎙️ آوابرداری دارد. در سیاههٔ یادداشت‌ها: یافتن، چینش نو یا کهنه، دکمه‌های برچسب، «ویرایش»، «رونوشت» و «پاک کردن».",
"زنگ: «زنگ نو» نام، هنگام (با AM و PM) و روزها را می‌خواهد: هر روز، روزهای برگزیدهٔ هفته، یا یک روز ویژه از گاه‌شمار. با کلیدِ روشن، آن را روشن یا خاموش کنید.",
"تایمر: «تایمر نو» را بزنید، اندازه را بنویسید یا یکی از ۱، ۵، ۱۰، ۱۵، ۳۰ و ۶۰ را برگزینید و «آغاز» را بزنید. شمارش زنده است.",
"پنجرهٔ زنگ: هنگام زنگ، تایمر یا بار خوردن دارو، پنجره‌ای بزرگ می‌آید و زنگ پیوسته می‌نوازد تا کاری کنید: «خاموش»، «دیرتر» (۵ بار شمردن)، یا برای دارو «✓ خورده شد».",
"آمار و نمودار: گردِ امروز، بیشترین پیاپی، میانگین، و نمودار 🧱 آجری، 📈 دندانه‌ای یا هر دو، برای ۷، ۳۰ یا ۹۰ روز.",
"هشدارها (سرخ، بالای برگه): داروهای دیرشده، شمار مانده کم، و شبانگاه خوهایی که پیاپی‌شان می‌شکند.",
"گزینه‌ها: زبان (۳۰ زبان)، پوسته (خاکستری، تیره، روشن، خودکار)، درازای چهارخانه‌ها (۳۰ تا ۱۸۰ روز)، نمایش هنگام (۱۲ بخشی با AM و PM، یا ۲۴ بخشی)، آوا، آگاه‌سازی روی دستگاه، هشدار شبانه و هنگامش، روشن ماندن نمایشگر، گذرواژهٔ پدر و مادر، رنگ‌ها و نوشتار، پشتیبان‌گیری و بازگرداندن، پاک‌سازی همه.",
"رنگ‌ها و نوشتار: همهٔ رنگ‌ها، فونت متن و سرنویس (۱۴ گونه)، اندازهٔ نوشته، سرنویس و یادداشت، و گوشه‌ها از تیز تا گرد. «بازنشانی» همه را به آغاز برمی‌گرداند.",
"یاد بسپارید: داده‌های شما تنها روی همین دستگاه می‌ماند. برای زنگ داروها، برگه را باز و نمایشگر را روشن نگه دارید (گزینهٔ «روشن ماندن نمایشگر» کمک می‌کند)."],
hy:["Ուղեցույց","Իմ մասին","My Habit-ը օգնում է ձեզ սովորություններ ձևավորել, դեղերը ժամանակին ընդունել, գրառումներ և ձայնագրություններ պահել և զարթուցիչներով ու գծապատկերներով ճիշտ ուղու վրա մնալ։ Ձեր տվյալները մնում են միայն ձեր սարքում։",
"Սովորություններ՝ հպեք վանդակներին կամ ✓-ին՝ օրը նշելու համար. ավելացրեք էմոջի, պատկերակներ կամ ձեր սեփական պատկերը։",
"Խմբեր՝ Փոքրիկներ, Դպրոցականներ, Տարեցներ, Մեծահասակներ, կամ ստեղծեք ձեր սեփական թղթապանակը։",
"Ծնողի PIN՝ արգելափակում է խմբագրումը մանկական խմբերում. «Ծնող» կոճակը բացում է։",
"Դեղեր՝ սահմանեք ժամերը, հպեք ամեն չափաբաժնին, ստացեք զգուշացում պաշարի սպառվելու դեպքում։",
"Նոթատետր՝ գրառումներ ամսաթվով, պիտակներ, ցուցակներ, ամրացում և ձայնագրություն։",
"Զարթուցիչներ և ժամանակաչափներ՝ ըստ ժամի, շաբաթվա օրվա կամ ամսաթվի. զանգում է մինչև կանգնեցնեք։",
"Գծապատկերներ՝ աղյուսներ, ատամնավոր գիծ կամ երկուսը միասին։ Ընտրանքներ՝ գույներ, 14 տառատեսակ, անկյուններ։",
"Ձեր տվյալները մնում են այս սարքում։ Պահուստավորեք Ընտրանքներում։ Զարթուցիչների համար թողեք էջը բաց։"],

de:["Anleitung","Über mich","My Habit hilft dir, Gewohnheiten aufzubauen, Medikamente pünktlich zu nehmen, Notizen und Sprachmemos zu führen und mit Wecker und Diagrammen dranzubleiben. Deine Daten bleiben nur auf deinem Gerät.",

pt:["Tutorial","Sobre mim","O My Habit ajuda você a criar hábitos, tomar remédios no horário, guardar notas e memorandos de voz e se manter no rumo com alarmes e gráficos. Seus dados ficam só no seu dispositivo.",

ru:["Руководство","Обо мне","My Habit помогает вырабатывать привычки, вовремя принимать лекарства, вести заметки и голосовые записи и не сбиваться с пути с помощью будильников и графиков. Ваши данные остаются только на вашем устройстве.",
"Привычки: нажимайте на квадраты или ✓, чтобы отметить день; добавляйте эмодзи, значки или своё изображение.",
"Группы: Малыши, Школьники, Пожилые, Взрослые — или создайте свою папку.",
"Родительский PIN: блокирует правку в детских группах; кнопка «Родитель» открывает.",
"Лекарства: задайте время, отмечайте каждый приём, получайте предупреждения о малом запасе.",
"Блокнот: заметки с датой, теги, списки дел, закрепление и запись голоса.",
"Будильники и таймеры: по времени, дню недели или дате; звонит, пока не остановите.",
"Графики: кирпичи, зубчатая линия или оба. Параметры: цвета, 14 шрифтов, углы.",
"Данные остаются на этом устройстве. Копируйте их в Параметрах. Держите страницу открытой для будильников."],
tr:["Rehber","Hakkımda","My Habit alışkanlık edinmenize, ilaçlarınızı zamanında almanıza, not ve ses kaydı tutmanıza, alarm ve grafiklerle yolda kalmanıza yardımcı olur. Verileriniz yalnızca cihazınızda kalır.",
"Alışkanlıklar: bir günü işaretlemek için karelere veya ✓ simgesine dokunun; emoji, simge veya kendi resminizi ekleyin.",
"Gruplar: Minikler, Okul çocukları, Yaşlılar, Yetişkinler — ya da kendi klasörünüzü oluşturun.",
"Ebeveyn PIN’i: çocuk gruplarında düzenlemeyi kilitler; Ebeveyn düğmesi açar.",
"İlaçlar: saatleri belirleyin, her dozu işaretleyin, stok azalınca uyarı alın.",
"Defter: tarihli notlar, etiketler, yapılacaklar listeleri, sabitleme ve ses kaydı.",
"Alarmlar ve zamanlayıcılar: saate, haftanın gününe veya tarihe göre; durdurana kadar çalar.",
"Grafikler: tuğla, tırtıklı çizgi veya ikisi birden. Seçenekler: renkler, 14 yazı tipi, köşeler.",
"Verileriniz bu cihazda kalır. Seçenekler’den yedekleyin. Alarmlar için sayfayı açık tutun."],
zh:["教程","关于我","My Habit 帮你养成习惯、按时服药、记录笔记和语音备忘，并用闹钟和图表保持节奏。你的数据只保存在你自己的设备上。",
"习惯：点按方格或 ✓ 来标记某一天；可添加表情符号、图标或自己的图片。",
"分组：幼儿、学童、长者、成人，也可以新建自己的文件夹。",
"家长密码：锁定儿童分组的编辑功能；点“家长”按钮即可解锁。",
"药物：设置时间，点按每次服药，库存不足时会提醒。",
"笔记本：带日期的笔记、标签、清单、置顶和语音录音。",
"闹钟与计时器：可按时间、星期或日期设置；响铃直到你停止。",
"图表：砖块、锯齿折线或两者并用。选项：颜色、14 种字体、圆角。",
"数据保存在本设备上。请在“选项”中备份。使用闹钟时请保持页面打开。"],
ja:["使い方","私について","My Habit は、習慣づくり、薬の飲み忘れ防止、メモや音声メモの保存、アラームとグラフで続けるのを助けます。データはあなたの端末の中だけに保存されます。",
"習慣：四角か ✓ をタップしてその日を記録。絵文字、アイコン、自分の画像も追加できます。",
"グループ：幼児、学童、シニア、大人。自分用のフォルダも作れます。",
"保護者PIN：子ども用グループの編集をロック。「保護者」ボタンで解除します。",
"薬：時刻を設定し、服用ごとにタップ。残りが少なくなると警告します。",
"ノート：日付付きメモ、タグ、チェックリスト、ピン留め、音声録音。",
"アラームとタイマー：時刻・曜日・日付で設定。止めるまで鳴り続けます。",
"グラフ：レンガ、ギザギザの線、または両方。オプション：色、14種のフォント、角の形。",
"データはこの端末に残ります。オプションでバックアップを。アラームのためページを開いたままに。"],
ko:["사용법","나에 대해","My Habit은 습관 만들기, 제때 약 먹기, 메모와 음성 메모 보관, 알람과 차트로 꾸준히 이어가기를 도와줍니다. 데이터는 오직 내 기기에만 저장됩니다.",
"습관: 네모 칸이나 ✓를 눌러 하루를 표시하세요. 이모지, 아이콘, 내 이미지를 넣을 수 있습니다.",
"그룹: 유아, 학생, 어르신, 성인 — 또는 나만의 폴더를 만드세요.",
"보호자 PIN: 어린이 그룹의 편집을 잠급니다. ‘보호자’ 버튼으로 해제합니다.",
"약: 시간을 정하고 복용할 때마다 누르세요. 재고가 적으면 경고합니다.",
"노트: 날짜가 있는 메모, 태그, 체크리스트, 고정, 음성 녹음.",
"알람과 타이머: 시각, 요일, 날짜로 설정. 멈출 때까지 울립니다.",
"차트: 벽돌, 톱니 모양 선, 또는 둘 다. 옵션: 색상, 글꼴 14종, 모서리.",
"데이터는 이 기기에 남습니다. 옵션에서 백업하세요. 알람을 위해 페이지를 열어 두세요."],
hi:["ट्यूटोरियल","मेरे बारे में","My Habit आपको आदतें बनाने, समय पर दवा लेने, नोट्स और वॉइस मेमो रखने, और अलार्म व चार्ट से सही राह पर रहने में मदद करता है। आपका डेटा सिर्फ़ आपके डिवाइस पर रहता है।",
"आदतें: दिन चिह्नित करने के लिए खानों या ✓ पर टैप करें; इमोजी, आइकन या अपनी तस्वीर जोड़ें।",
"समूह: छोटे बच्चे, स्कूली बच्चे, बुज़ुर्ग, वयस्क — या अपना फ़ोल्डर बनाएँ।",
"अभिभावक पिन: बच्चों के समूहों में बदलाव लॉक करता है; “अभिभावक” बटन से खुलता है।",
"दवाएँ: समय तय करें, हर खुराक पर टैप करें, स्टॉक कम होने पर चेतावनी पाएँ।",
"नोटबुक: तारीख वाले नोट्स, टैग, चेकलिस्ट, पिन और आवाज़ रिकॉर्डिंग।",
"अलार्म और टाइमर: समय, सप्ताह के दिन या तारीख से; रोकने तक बजता है।",
"चार्ट: ईंटें, दाँतेदार रेखा या दोनों। विकल्प: रंग, 14 फ़ॉन्ट, कोने।",
"आपका डेटा इसी डिवाइस पर रहता है। विकल्प में बैकअप लें। अलार्म के लिए पेज खुला रखें।"],
bn:["টিউটোরিয়াল","আমার সম্পর্কে","My Habit আপনাকে অভ্যাস গড়তে, সময়মতো ওষুধ খেতে, নোট ও ভয়েস মেমো রাখতে এবং অ্যালার্ম ও চার্টের সাহায্যে ঠিক পথে থাকতে সাহায্য করে। আপনার ডেটা শুধু আপনার ডিভাইসেই থাকে।",
"অভ্যাস: দিন চিহ্নিত করতে ঘর বা ✓ চাপুন; ইমোজি, আইকন বা নিজের ছবি যোগ করুন।",
"গ্রুপ: শিশু, স্কুলের ছাত্র, প্রবীণ, প্রাপ্তবয়স্ক — অথবা নিজের ফোল্ডার বানান।",
"অভিভাবক পিন: শিশুদের গ্রুপে সম্পাদনা লক করে; “অভিভাবক” বোতামে খোলে।",
"ওষুধ: সময় ঠিক করুন, প্রতিটি ডোজে চাপুন, মজুত কমলে সতর্কতা পান।",
"নোটবুক: তারিখসহ নোট, ট্যাগ, চেকলিস্ট, পিন ও ভয়েস রেকর্ডিং।",
"অ্যালার্ম ও টাইমার: সময়, সপ্তাহের দিন বা তারিখ অনুযায়ী; থামানো পর্যন্ত বাজে।",
"চার্ট: ইট, ভাঙা রেখা বা দুটোই। বিকল্প: রং, ১৪টি ফন্ট, কোণ।",
"আপনার ডেটা এই ডিভাইসেই থাকে। বিকল্পে ব্যাকআপ নিন। অ্যালার্মের জন্য পেজ খোলা রাখুন।"],
he:["מדריך","עליי","My Habit עוזר לך לבנות הרגלים, ליטול תרופות בזמן, לשמור הערות והקלטות קוליות, ולהישאר במסלול עם התראות ותרשימים. הנתונים שלך נשארים רק במכשיר שלך.",
"הרגלים: הקש על הריבועים או על ✓ כדי לסמן יום; הוסף אימוג׳י, סמלים או תמונה משלך.",
"קבוצות: פעוטות, תלמידים, קשישים, בוגרים — או צור תיקייה משלך.",
"קוד הורים: נועל עריכה בקבוצות הילדים; כפתור ״הורה״ פותח.",
"תרופות: קבע שעות, הקש על כל מנה וקבל אזהרה כשהמלאי נמוך.",
"מחברת: הערות עם תאריך, תגיות, רשימות, נעיצה והקלטת קול.",
"התראות וטיימרים: לפי שעה, יום בשבוע או תאריך; מצלצל עד שתעצור.",
"תרשימים: לבנים, קו משונן או שניהם. אפשרויות: צבעים, 14 גופנים, פינות.",
"הנתונים נשארים במכשיר הזה. גבה באפשרויות. השאר את הדף פתוח בשביל ההתראות."],
tl:["Gabay","Tungkol sa akin","Tinutulungan ka ng My Habit na bumuo ng mga gawi, uminom ng gamot sa oras, mag-ingat ng mga tala at voice memo, at manatili sa tamang landas gamit ang mga alarma at tsart. Ang iyong data ay nananatili lamang sa iyong device.",
"Mga gawi: pindutin ang mga kahon o ✓ para markahan ang araw; magdagdag ng emoji, icon, o sarili mong larawan.",
"Mga grupo: Mga paslit, Mga mag-aaral, Mga nakatatanda, Mga nasa hustong gulang — o gumawa ng sarili mong folder.",
"Parent PIN: nila-lock ang pag-edit sa mga grupo ng bata; ina-unlock ito ng button na Magulang.",
"Mga gamot: itakda ang oras, pindutin ang bawat dosis, makatanggap ng babala kapag paubos na.",
"Notebook: mga tala na may petsa, tag, checklist, pin, at voice recording.",
"Mga alarma at timer: ayon sa oras, araw ng linggo, o petsa; tutunog hanggang ihinto mo.",
"Mga tsart: ladrilyo, gilid-gilid na linya, o pareho. Mga opsyon: kulay, 14 font, sulok.",
"Nananatili ang data sa device na ito. Mag-backup sa Mga Opsyon. Panatilihing bukas ang page para sa mga alarma."],
id:["Panduan","Tentang saya","My Habit membantu Anda membangun kebiasaan, minum obat tepat waktu, menyimpan catatan dan memo suara, serta tetap di jalur dengan alarm dan grafik. Data Anda hanya tersimpan di perangkat Anda.",
"Kebiasaan: ketuk kotak atau ✓ untuk menandai hari; tambahkan emoji, ikon, atau gambar Anda sendiri.",
"Grup: Balita, Anak sekolah, Lansia, Dewasa — atau buat folder sendiri.",
"PIN orang tua: mengunci pengeditan di grup anak; tombol Orang tua membukanya.",
"Obat: atur jam, ketuk setiap dosis, dapatkan peringatan stok menipis.",
"Buku catatan: catatan bertanggal, tag, daftar centang, sematan, dan rekaman suara.",
"Alarm dan timer: berdasarkan jam, hari, atau tanggal; berbunyi sampai Anda hentikan.",
"Grafik: bata, garis bergerigi, atau keduanya. Opsi: warna, 14 font, sudut.",
"Data Anda tetap di perangkat ini. Cadangkan di Opsi. Biarkan halaman terbuka agar alarm berbunyi."],
vi:["Hướng dẫn","Về tôi","My Habit giúp bạn xây dựng thói quen, uống thuốc đúng giờ, lưu ghi chú và ghi âm, và giữ vững tiến độ bằng báo thức và biểu đồ. Dữ liệu của bạn chỉ nằm trên thiết bị của bạn.",
"Thói quen: chạm vào các ô hoặc ✓ để đánh dấu ngày; thêm emoji, biểu tượng hoặc ảnh của bạn.",
"Nhóm: Trẻ nhỏ, Học sinh, Người cao tuổi, Người lớn — hoặc tạo thư mục riêng.",
"Mã PIN phụ huynh: khóa chỉnh sửa trong nhóm trẻ em; nút Phụ huynh để mở khóa.",
"Thuốc: đặt giờ, chạm từng liều, nhận cảnh báo khi sắp hết.",
"Sổ tay: ghi chú có ngày, thẻ, danh sách việc, ghim và ghi âm.",
"Báo thức và hẹn giờ: theo giờ, thứ hoặc ngày; kêu đến khi bạn tắt.",
"Biểu đồ: gạch, đường răng cưa hoặc cả hai. Tùy chọn: màu, 14 phông chữ, góc bo.",
"Dữ liệu ở lại trên thiết bị này. Sao lưu trong Tùy chọn. Giữ trang mở để báo thức hoạt động."],
th:["วิธีใช้","เกี่ยวกับฉัน","My Habit ช่วยให้คุณสร้างนิสัย กินยาตรงเวลา จดบันทึกและเสียงบันทึก และรักษาจังหวะด้วยนาฬิกาปลุกและกราฟ ข้อมูลของคุณอยู่ในอุปกรณ์ของคุณเท่านั้น",
"นิสัย: แตะช่องสี่เหลี่ยมหรือ ✓ เพื่อทำเครื่องหมายวัน เพิ่มอีโมจิ ไอคอน หรือรูปของคุณเอง",
"กลุ่ม: เด็กเล็ก เด็กนักเรียน ผู้สูงอายุ ผู้ใหญ่ หรือสร้างโฟลเดอร์ของคุณเอง",
"PIN ผู้ปกครอง: ล็อกการแก้ไขในกลุ่มเด็ก ปุ่ม “ผู้ปกครอง” ใช้ปลดล็อก",
"ยา: ตั้งเวลา แตะทุกครั้งที่กิน และรับคำเตือนเมื่อยาใกล้หมด",
"สมุดบันทึก: บันทึกพร้อมวันที่ แท็ก เช็กลิสต์ การปักหมุด และการอัดเสียง",
"นาฬิกาปลุกและตัวจับเวลา: ตามเวลา วันในสัปดาห์ หรือวันที่ ดังจนกว่าคุณจะหยุด",
"กราฟ: อิฐ เส้นหยัก หรือทั้งสองแบบ ตัวเลือก: สี ฟอนต์ 14 แบบ มุม",
"ข้อมูลอยู่ในอุปกรณ์นี้ สำรองข้อมูลได้ในตัวเลือก เปิดหน้านี้ไว้เพื่อให้นาฬิกาปลุกทำงาน"],
nl:["Handleiding","Over mij","My Habit helpt je gewoonten op te bouwen, medicijnen op tijd in te nemen, notities en spraakmemo’s te bewaren en op koers te blijven met wekkers en grafieken. Je gegevens blijven alleen op je eigen apparaat.",
"Gewoontes: tik op de vakjes of ✓ om een dag te markeren; voeg emoji, pictogrammen of je eigen afbeelding toe.",
"Groepen: Peuters, Schoolkinderen, Ouderen, Volwassenen — of maak je eigen map.",
"Ouderpincode: vergrendelt bewerken in kindergroepen; de knop Ouder ontgrendelt.",
"Medicijnen: stel tijden in, tik elke dosis aan, krijg waarschuwingen bij lage voorraad.",
"Notitieboek: notities met datum, labels, checklists, vastpinnen en spraakopname.",
"Wekkers en timers: op tijd, weekdag of datum; gaat af tot je stopt.",
"Grafieken: bakstenen, zigzaglijn of beide. Opties: kleuren, 14 lettertypen, hoeken.",
"Je gegevens blijven op dit apparaat. Maak een back-up in Opties. Houd de pagina open voor wekkers."],
pl:["Poradnik","O mnie","My Habit pomaga budować nawyki, brać leki o czasie, zapisywać notatki i notatki głosowe oraz trzymać kurs dzięki alarmom i wykresom. Twoje dane zostają tylko na Twoim urządzeniu.",
"Nawyki: dotknij kratek lub ✓, aby zaznaczyć dzień; dodaj emoji, ikony lub własny obraz.",
"Grupy: Maluchy, Uczniowie, Seniorzy, Dorośli — albo utwórz własny folder.",
"PIN rodzica: blokuje edycję w grupach dziecięcych; przycisk Rodzic odblokowuje.",
"Leki: ustaw godziny, dotykaj każdej dawki, otrzymuj ostrzeżenia o niskim zapasie.",
"Notatnik: notatki z datą, tagi, listy kontrolne, przypinanie i nagrywanie głosu.",
"Alarmy i minutniki: według godziny, dnia tygodnia lub daty; dzwonią, aż zatrzymasz.",
"Wykresy: cegły, zygzakowata linia lub oba. Opcje: kolory, 14 czcionek, rogi.",
"Dane zostają na tym urządzeniu. Utwórz kopię w Opcjach. Zostaw stronę otwartą dla alarmów."],
uk:["Посібник","Про мене","My Habit допомагає виробляти звички, вчасно приймати ліки, вести нотатки й голосові записи та триматися курсу за допомогою будильників і графіків. Ваші дані залишаються лише на вашому пристрої.",
"Звички: торкайтеся квадратів або ✓, щоб позначити день; додавайте емодзі, значки чи власне зображення.",
"Групи: Малюки, Школярі, Літні люди, Дорослі — або створіть власну папку.",
"Батьківський PIN: блокує редагування в дитячих групах; кнопка «Батьки» розблоковує.",
"Ліки: задайте час, торкайтеся кожного прийому, отримуйте попередження про малий запас.",
"Блокнот: нотатки з датою, теги, списки справ, закріплення та голосовий запис.",
"Будильники й таймери: за часом, днем тижня чи датою; дзвонить, доки не зупините.",
"Графіки: цеглини, зубчаста лінія або обидва. Параметри: кольори, 14 шрифтів, кути.",
"Дані залишаються на цьому пристрої. Робіть резервну копію в Параметрах. Тримайте сторінку відкритою для будильників."],
sv:["Handledning","Om mig","My Habit hjälper dig att bygga vanor, ta medicin i tid, spara anteckningar och röstmemon och hålla kursen med alarm och diagram. Dina data stannar bara på din egen enhet.",
"Vanor: tryck på rutorna eller ✓ för att markera en dag; lägg till emoji, ikoner eller en egen bild.",
"Grupper: Småbarn, Skolbarn, Seniorer, Vuxna — eller skapa en egen mapp.",
"Föräldra-PIN: låser redigering i barngrupper; knappen Förälder låser upp.",
"Mediciner: ställ in tider, tryck på varje dos, få varning vid lågt lager.",
"Anteckningsbok: anteckningar med datum, taggar, checklistor, fästning och röstinspelning.",
"Alarm och timers: efter klockslag, veckodag eller datum; ringer tills du stoppar.",
"Diagram: tegel, sicksackslinje eller båda. Alternativ: färger, 14 typsnitt, hörn.",
"Dina data stannar på den här enheten. Säkerhetskopiera under Alternativ. Håll sidan öppen för alarm."],
el:["Οδηγός","Σχετικά με εμένα","Το My Habit σε βοηθά να χτίζεις συνήθειες, να παίρνεις τα φάρμακά σου στην ώρα τους, να κρατάς σημειώσεις και φωνητικά μηνύματα και να μένεις σε τροχιά με ξυπνητήρια και γραφήματα. Τα δεδομένα σου μένουν μόνο στη συσκευή σου.",
"Συνήθειες: πάτα τα τετράγωνα ή το ✓ για να σημειώσεις μια μέρα· πρόσθεσε emoji, εικονίδια ή δική σου εικόνα.",
"Ομάδες: Νήπια, Μαθητές, Ηλικιωμένοι, Ενήλικες — ή φτιάξε δικό σου φάκελο.",
"PIN γονέα: κλειδώνει την επεξεργασία στις παιδικές ομάδες· το κουμπί «Γονέας» ξεκλειδώνει.",
"Φάρμακα: όρισε ώρες, πάτα κάθε δόση, λάβε προειδοποιήσεις χαμηλού αποθέματος.",
"Σημειωματάριο: σημειώσεις με ημερομηνία, ετικέτες, λίστες, καρφίτσωμα και ηχογράφηση.",
"Ξυπνητήρια και χρονόμετρα: με ώρα, ημέρα εβδομάδας ή ημερομηνία· χτυπά μέχρι να σταματήσεις.",
"Γραφήματα: τούβλα, οδοντωτή γραμμή ή και τα δύο. Επιλογές: χρώματα, 14 γραμματοσειρές, γωνίες.",
"Τα δεδομένα μένουν σε αυτή τη συσκευή. Κάνε αντίγραφο στις Επιλογές. Κράτα τη σελίδα ανοιχτή για τα ξυπνητήρια."],
cs:["Návod","O mně","My Habit vám pomáhá budovat návyky, brát léky včas, ukládat poznámky a hlasové zprávy a držet směr pomocí budíků a grafů. Vaše data zůstávají jen ve vašem zařízení.",
"Návyky: klepněte na čtverečky nebo ✓ a označte den; přidejte emoji, ikony nebo vlastní obrázek.",
"Skupiny: Batolata, Školáci, Senioři, Dospělí — nebo si vytvořte vlastní složku.",
"PIN rodiče: zamkne úpravy v dětských skupinách; tlačítko Rodič ho odemkne.",
"Léky: nastavte časy, klepněte na každou dávku, dostanete upozornění na nízkou zásobu.",
"Zápisník: poznámky s datem, štítky, seznamy úkolů, připnutí a hlasový záznam.",
"Budíky a časovače: podle času, dne v týdnu nebo data; zvoní, dokud nezastavíte.",
"Grafy: cihly, zubatá čára nebo obojí. Možnosti: barvy, 14 písem, rohy.",
"Data zůstávají v tomto zařízení. Zálohujte v Možnostech. Nechte stránku otevřenou kvůli budíkům."],
ro:["Ghid","Despre mine","My Habit te ajută să-ți construiești obiceiuri, să iei medicamentele la timp, să păstrezi notițe și mesaje vocale și să rămâi pe drumul cel bun cu alarme și grafice. Datele tale rămân doar pe dispozitivul tău.",
"Obiceiuri: atinge pătrățelele sau ✓ ca să marchezi o zi; adaugă emoji, pictograme sau propria imagine.",
"Grupuri: Cei mici, Școlari, Vârstnici, Adulți — sau creează propriul dosar.",
"PIN părinte: blochează editarea în grupurile copiilor; butonul Părinte îl deblochează.",
"Medicamente: setează orele, atinge fiecare doză, primește avertizări de stoc scăzut.",
"Carnet: notițe cu dată, etichete, liste, fixare și înregistrare vocală.",
"Alarme și temporizatoare: după oră, zi a săptămânii sau dată; sună până o oprești.",
"Grafice: cărămizi, linie zimțată sau ambele. Opțiuni: culori, 14 fonturi, colțuri.",
"Datele rămân pe acest dispozitiv. Fă o copie de siguranță în Opțiuni. Ține pagina deschisă pentru alarme."],
hu:["Útmutató","Rólam","A My Habit segít szokásokat kialakítani, időben bevenni a gyógyszereket, jegyzeteket és hangjegyzeteket tárolni, és ébresztőkkel és diagramokkal a pályán maradni. Az adataid csak az eszközödön maradnak.",
"Szokások: koppints a négyzetekre vagy a ✓ jelre egy nap megjelöléséhez; adj hozzá emojit, ikont vagy saját képet.",
"Csoportok: Kisgyerekek, Iskolások, Idősek, Felnőttek — vagy hozz létre saját mappát.",
"Szülői PIN: zárolja a szerkesztést a gyerekcsoportokban; a Szülő gomb feloldja.",
"Gyógyszerek: állítsd be az időket, koppints minden adagra, figyelmeztetést kapsz alacsony készletnél.",
"Jegyzetfüzet: dátumozott jegyzetek, címkék, ellenőrzőlisták, kitűzés és hangfelvétel.",
"Ébresztők és időzítők: idő, hét napja vagy dátum szerint; addig szól, amíg le nem állítod.",
"Diagramok: téglák, cikk-cakk vonal vagy mindkettő. Beállítások: színek, 14 betűtípus, sarkok.",
"Az adataid ezen az eszközön maradnak. Készíts mentést a Beállításokban. Tartsd nyitva az oldalt az ébresztőkhöz."],
fi:["Opas","Minusta","My Habit auttaa rakentamaan tapoja, ottamaan lääkkeet ajallaan, tallentamaan muistiinpanoja ja äänimuistioita sekä pysymään kurssilla herätyksillä ja kaavioilla. Tietosi pysyvät vain omalla laitteellasi.",
"Tavat: napauta ruutuja tai ✓ merkitäksesi päivän; lisää emoji, kuvakkeita tai oma kuva.",
"Ryhmät: Taaperot, Koululaiset, Seniorit, Aikuiset — tai luo oma kansio.",
"Vanhemman PIN: lukitsee muokkauksen lasten ryhmissä; Vanhempi-painike avaa lukituksen.",
"Lääkkeet: aseta ajat, napauta jokaista annosta ja saat varoituksen, kun varasto on vähissä.",
"Muistikirja: päivätyt muistiinpanot, tunnisteet, tehtävälistat, kiinnitys ja äänitys.",
"Herätykset ja ajastimet: kellonajan, viikonpäivän tai päivämäärän mukaan; soi kunnes pysäytät.",
"Kaaviot: tiilet, sahalaitainen viiva tai molemmat. Asetukset: värit, 14 fonttia, kulmat.",
"Tietosi pysyvät tällä laitteella. Varmuuskopioi Asetuksissa. Pidä sivu auki herätyksiä varten."],
da:["Vejledning","Om mig","My Habit hjælper dig med at opbygge vaner, tage medicin til tiden, gemme noter og talememoer og holde kursen med alarmer og diagrammer. Dine data bliver kun på din egen enhed.",
"Vaner: tryk på felterne eller ✓ for at markere en dag; tilføj emoji, ikoner eller dit eget billede.",
"Grupper: Småbørn, Skolebørn, Seniorer, Voksne — eller opret din egen mappe.",
"Forældre-PIN: låser redigering i børnegrupper; knappen Forælder låser op.",
"Medicin: indstil tidspunkter, tryk på hver dosis, få advarsel ved lavt lager.",
"Notesbog: noter med dato, tags, tjeklister, fastgørelse og lydoptagelse.",
"Alarmer og timere: efter tid, ugedag eller dato; ringer til du stopper den.",
"Diagrammer: mursten, takket linje eller begge. Indstillinger: farver, 14 skrifttyper, hjørner.",
"Dine data bliver på denne enhed. Tag backup under Indstillinger. Hold siden åben til alarmer."],
no:["Veiledning","Om meg","My Habit hjelper deg å bygge vaner, ta medisin i tide, lagre notater og talememoer og holde kursen med alarmer og diagrammer. Dataene dine blir kun på din egen enhet.",
"Vaner: trykk på rutene eller ✓ for å markere en dag; legg til emoji, ikoner eller ditt eget bilde.",
"Grupper: Småbarn, Skolebarn, Seniorer, Voksne — eller lag din egen mappe.",
"Foreldre-PIN: låser redigering i barnegrupper; Forelder-knappen låser opp.",
"Medisiner: sett tidspunkter, trykk på hver dose, få varsel ved lav beholdning.",
"Notatbok: notater med dato, etiketter, sjekklister, festing og lydopptak.",
"Alarmer og timere: etter klokkeslett, ukedag eller dato; ringer til du stopper den.",
"Diagrammer: murstein, takkete linje eller begge. Valg: farger, 14 skrifttyper, hjørner.",
"Dataene dine blir på denne enheten. Ta sikkerhetskopi under Valg. Hold siden åpen for alarmer."]

let WL=null;
async function applyWake(){try{if(window.HG&&HG.keepScreenOn){HG.keepScreenOn(!!S.wake);return}if(S.wake&&!document.hidden&&navigator.wakeLock){if(!WL){WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null})}}else if(WL){await WL.release();WL=null}}catch(e){WL=null}}
document.addEventListener("change",e=>{if(e.target.dataset.o==="wake")applyWake()});
function ringStart(title,body,med){ringStop();bell();RING=setInterval(bell,1500);RSN=title;const d=document.createElement("div");d.className="ov on";d.id="ringov";d.style.zIndex=99;d.innerHTML=`<div class="md" style="text-align:center"><div style="font-size:3rem">${med?"💊":"🔔"}</div><h2>${esc(title)}</h2><p class="sub">${esc(body||"")}</p><div class="act" style="justify-content:center">${med?`<button class="pri" data-a="rtake" data-id="${med.id}" data-t="${med.t}">${T("m_taken")}</button>`:""}<button class="${med?"":"pri"}" data-a="rstop">${T("ring_stop")}</button><button data-a="rsnz">${T("ring_snz")}</button></div></div>`;document.body.append(d);if(S.notif&&window.Notification&&Notification.permission==="granted")try{new Notification(title,{body})}catch(e){}}
Object.assign(ACT,{rtake:(e)=>{const m=S.meds.find(x=>x.id===e.dataset.id);if(m){const t=back(0),x=e.dataset.t;m.log=m.log||{};const a=m.log[t]=m.log[t]||[];if(!a.includes(x)){a.push(x);if(m.stock!=null)m.stock=Math.max(0,m.stock-1)}save()}ringStop();render()}});
document.addEventListener("click",e=>{if(e.target.id==="ov")return closeM();const el=e.target.closest("[data-a]");if(el&&ACT[el.dataset.a]){if(!gate(el)){toast(T("locked"),1);return pinAsk()}ACT[el.dataset.a](el)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM();if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.a==="col")e.target.click()});
document.addEventListener("input",e=>{if(e.target.id==="fe"){const v=e.target.value.trim();if(!v)return;const f=window.Intl&&Intl.Segmenter?[...new Intl.Segmenter().segment(v)][0].segment:Array.from(v)[0];D.icon=f;D.image=null;$("#pv").textContent=f}});
document.addEventListener("change",async e=>{const t=e.target;
if(t.id==="fi"&&t.files[0]){readForm();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=96;const x=c.getContext("2d"),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);D.image=c.toDataURL("image/jpeg",.8);form()};im.src=r.result};r.readAsDataURL(t.files[0])}
const o=t.dataset&&t.dataset.o;if(!o)return;
if(o==="notif"){if(t.checked){if(!window.Notification){S.notif=false;toast(T("notif_no"),1);t.checked=false}else{const p=await Notification.requestPermission();S.notif=p==="granted";if(!S.notif){toast(T("notif_no"),1);t.checked=false}}}else S.notif=false}
else if(o==="warnHour")S.warnHour=+t.value;else if(o==="sort")S.sort=t.value;else S[o]=t.checked;
save();if(o==="sort")render();else warnUI()});

const fired=new Set();
function tick(){const n=new Date(),hm=p2(n.getHours())+":"+p2(n.getMinutes()),t=ymd(n);
if(t!==curDay){curDay=t;render();return}
S.habits.forEach(h=>{const k=h.id+t;if(h.remind&&h.remind<=hm&&mins(hm)-mins(h.remind)<=45&&!fired.has(k)){fired.add(k);if(!h.done.includes(t))notify(T("r_toast",h.name),h.name)}});warnUI()}
setInterval(tick,20000);
render();tick();applyWake();
